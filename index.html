<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TobiTools – 3D‑Druck Preisrechner</title>

<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --radius: 12px;
    --shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    padding: 30px;
    margin: 0;
  }

  .box {
    max-width: 850px;
    margin: auto;
    background: var(--card-bg);
    padding: 32px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  h1 {
    margin-top: 0;
    font-size: 1.9rem;
    font-weight: 700;
    color: #111827;
  }

  label {
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
    color: #374151;
  }

  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border-radius: var(--radius);
    border: 1px solid #c5c5c5;
    font-size: 1rem;
    background: #e0e0e0;
    transition: 0.2s;
    box-sizing: border-box;
    caret-color: #111;
    cursor: text;
  }

  input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
    outline: none;
    background: #d5d5d5;
  }

  .section {
    margin-top: 25px;
    padding-top: 10px;
    border-top: 1px solid #e5e7eb;
  }

  .result {
    background: var(--primary);
    color: white;
    padding: 20px;
    border-radius: var(--radius);
    font-size: 1.8rem;
    font-weight: 700;
    text-align: center;
    margin-top: 30px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
  }

  .hidden { display: none; }

  #resetStl {
    margin-top: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #ef4444;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  #resetStl:hover {
    background: #dc2626;
  }

  #stlInfo {
    margin-top: 10px;
    color: #2563eb;
    font-weight: 600;
  }
</style>
</head>

<body>

<div class="box">
  <h1>TobiTools – 3D‑Druck Preisrechner</h1>

  <label>Berechnungsmethode</label>
  <select id="mode">
    <option value="vol">Volumen (L × B × H)</option>
    <option value="gramm">Gewicht (g)</option>
  </select>

  <div id="volFields" class="section">
    <label>Länge (mm)</label>
    <input type="number" id="len" placeholder="z. B. 50">

    <label>Breite (mm)</label>
    <input type="number" id="wid" placeholder="z. B. 50">

    <label>Höhe (mm)</label>
    <input type="number" id="hei" placeholder="z. B. 50">
  </div>

  <div id="grammField" class="section hidden">
    <label>Gewicht (g)</label>
    <input type="number" id="gramm" placeholder="z. B. 50">
  </div>

  <div class="section">
    <label>3D‑Modell (STL) hochladen</label>
    <input type="file" id="stlFile" accept=".stl">

    <div id="stlInfo" class="hidden">
      Maße wurden automatisch aus der STL-Datei übernommen.
    </div>

    <button id="resetStl" class="hidden">STL‑Maße zurücksetzen</button>
  </div>

  <div class="section">
    <label>Material</label>
    <select id="material">
      <option value="15|1.0">PLA – 15 €/kg</option>
      <option value="20|1.1">PETG – 20 €/kg</option>
      <option value="25|1.2">ABS/ASA – 25 €/kg</option>
      <option value="90|1.8">PA6‑CF20 – 90 €/kg</option>
      <option value="140|2.2">PA‑12 – 140 €/kg</option>
      <option value="140|2.5">PPS‑GF20 – 140 €/kg</option>
    </select>
  </div>

  <div class="result" id="price">0,00 €</div>
</div>

<!-- THREE.js + STLLoader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/STLLoader.js"></script>

<script>
function euro(v) {
  return v.toFixed(2).replace(".", ",") + " €";
}

function updateMode() {
  const mode = document.getElementById("mode").value;
  document.getElementById("volFields").classList.toggle("hidden", mode !== "vol");
  document.getElementById("grammField").classList.toggle("hidden", mode !== "gramm");
  calc();
}

function calc() {
  const mode = document.getElementById("mode").value;

  const matData = material.value.split("|");
  const matKg = parseFloat(matData[0]);
  const matFactor = parseFloat(matData[1]);

  let weight = 0;
  let volume = 0;

  if (mode === "gramm") {
    weight = parseFloat(gramm.value) || 0;
  } else {
    const L = parseFloat(len.value) || 0;
    const W = parseFloat(wid.value) || 0;
    const H = parseFloat(hei.value) || 0;

    volume = (L * W * H) / 1000; // mm³ → cm³
    weight = volume * 1.2;       // einfache Dichteannahme
  }

  const materialCost = weight * (matKg / 1000);
  const printHours = volume * 0.04;
  const machineCost = printHours * 1;
  const workCost = 0.25 * 15;

  const subtotal = materialCost + machineCost + workCost;
  const finalPrice = subtotal * matFactor * 1.20;

  price.textContent = euro(finalPrice);
}

// STL nur für Maße (X= Länge, Y= Breite, Z= Höhe)
const loader = new THREE.STLLoader();

document.getElementById("stlFile").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (event) {
    try {
      const arrayBuffer = event.target.result;
      const geometry = loader.parse(arrayBuffer);

      geometry.computeBoundingBox();
      const box = geometry.boundingBox;

      const length = box.max.x - box.min.x;
      const width  = box.max.y - box.min.y;
      const height = box.max.z - box.min.z;

      document.getElementById("len").value = length.toFixed(2);
      document.getElementById("wid").value = width.toFixed(2);
      document.getElementById("hei").value = height.toFixed(2);

      document.getElementById("stlInfo").classList.remove("hidden");
      document.getElementById("resetStl").classList.remove("hidden");

      calc();
    } catch (err) {
      alert("STL konnte nicht gelesen werden.");
    }
  };
  reader.readAsArrayBuffer(file);
});

// Reset STL
document.getElementById("resetStl").addEventListener("click", function () {

  document.getElementById("len").value = "";
  document.getElementById("wid").value = "";
  document.getElementById("hei").value = "";
  document.getElementById("gramm").value = "";
  document.getElementById("stlFile").value = "";

  document.getElementById("stlInfo").classList.add("hidden");
  document.getElementById("resetStl").classList.add("hidden");

  calc();
});

document.getElementById("mode").addEventListener("change", updateMode);
document.querySelectorAll("input, select").forEach(el => {
  el.addEventListener("input", calc);
});

updateMode();
</script>

</body>
</html>
