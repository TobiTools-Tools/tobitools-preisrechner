<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TobiTools – 3D‑Druck Preisrechner</title>

<style>
  :root {
    --primary: #2563eb;
    --bg: #f3f4f6;
    --card-bg: #ffffff;
    --radius: 12px;
    --shadow: 0 8px 20px rgba(0,0,0,0.08);
  }

  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    padding: 30px;
    margin: 0;
  }

  .box {
    max-width: 900px;
    margin: auto;
    background: var(--card-bg);
    padding: 32px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  h1 {
    margin-top: 0;
    font-size: 1.9rem;
    font-weight: 700;
    color: #111827;
  }

  label {
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
    color: #374151;
  }

  input, select {
    width: 100%;
    padding: 12px;
    margin-bottom: 16px;
    border-radius: var(--radius);
    border: 1px solid #c5c5c5;
    font-size: 1rem;
    background: #e0e0e0;
    transition: 0.2s;
    box-sizing: border-box;
    min-height: 48px;
  }

  input:focus, select:focus {
    border-color: --primary;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.25);
    outline: none;
    background: #d5d5d5;
  }

  .section {
    margin-top: 25px;
    padding-top: 10px;
    border-top: 1px solid #e5e7eb;
  }

  .result {
    background: var(--primary);
    color: white;
    padding: 20px;
    border-radius: var(--radius);
    font-size: 1.8rem;
    font-weight: 700;
    text-align: center;
    margin-top: 30px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
  }

  .hidden { display: none; }

  #resetStl {
    margin-top: 10px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #ef4444;
    color: white;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-size: 1rem;
  }

  #resetStl:hover {
    background: #dc2626;
  }

  #stlInfo {
    margin-top: 10px;
    color: #2563eb;
    font-weight: 600;
  }

  #priceDetails {
    margin-top: 15px;
    font-size: 1rem;
    color: #374151;
    text-align: center;
  }

  #previewContainer {
    width: 100%;
    height: 400px;
    background: #ddd;
    border-radius: 12px;
    overflow: hidden;
  }

  /* MOBILE OPTIMIERUNG */
  @media (max-width: 768px) {
    body {
      padding: 10px;
    }

    .box {
      padding: 20px;
    }

    input, select {
      font-size: 1.1rem;
      padding: 14px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
    }

    #previewContainer {
      height: 300px !important;
    }

    .result {
      font-size: 1.5rem;
      padding: 15px;
    }

    #priceDetails {
      font-size: 0.95rem;
    }

    label {
      font-size: 1rem;
    }
  }

  @media (max-width: 480px) {
    #previewContainer {
      height: 250px !important;
    }

    input, select {
      font-size: 1rem;
      padding: 12px;
    }

    .result {
      font-size: 1.3rem;
    }
  }
</style>

<!-- THREE.js + STL Loader + OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

</head>

<body>

<div class="box">
  <h1>TobiTools – 3D‑Druck Preisrechner</h1>

  <div class="section">
    <label>Länge (mm)</label>
    <input type="number" id="len">

    <label>Breite (mm)</label>
    <input type="number" id="wid">

    <label>Höhe (mm)</label>
    <input type="number" id="hei">
  </div>

  <div class="section">
    <label>3D‑Modell (STL) hochladen</label>
    <input type="file" id="stlFile" accept=".stl">

    <div id="stlInfo" class="hidden">
      Maße wurden automatisch aus der STL‑Datei übernommen.
    </div>

    <button id="resetStl" class="hidden">STL‑Maße zurücksetzen</button>
  </div>

  <div class="section">
    <label>STL Vorschau</label>
    <div id="previewContainer"></div>
  </div>

  <div class="section">
    <label>Füllung (%)</label>
    <select id="infill">
      <option value="0.10">10%</option>
      <option value="0.15" selected>15%</option>
      <option value="0.20">20%</option>
      <option value="0.25">25%</option>
      <option value="0.30">30%</option>
      <option value="0.40">40%</option>
      <option value="0.50">50%</option>
      <option value="0.75">75%</option>
      <option value="1.00">100%</option>
    </select>
  </div>

  <div class="section">
    <label>Anzahl (Menge)</label>
    <input type="number" id="qty" value="1" min="1">
  </div>

  <div class="section">
    <label>Material</label>
    <select id="material">
      <option value="15|1.0">PLA – 15 €/kg</option>
      <option value="20|1.1">PETG – 20 €/kg</option>
      <option value="25|1.2">ABS/ASA – 25 €/kg</option>
      <option value="90|1.8">PA6‑CF20 – 90 €/kg</option>
      <option value="140|2.2">PA‑12 – 140 €/kg</option>
      <option value="140|2.5">PPS‑GF20 – 140 €/kg</option>
    </select>
  </div>

  <div class="result" id="price">0,00 €</div>

  <div id="priceDetails"></div>
</div>

<script>
const lenEl = document.getElementById("len");
const widEl = document.getElementById("wid");
const heiEl = document.getElementById("hei");
const stlFileEl = document.getElementById("stlFile");
const stlInfo = document.getElementById("stlInfo");
const resetStl = document.getElementById("resetStl");
const infillEl = document.getElementById("infill");
const qtyEl = document.getElementById("qty");
const materialEl = document.getElementById("material");
const price = document.getElementById("price");
const priceDetails = document.getElementById("priceDetails");

function euro(v) {
  return v.toFixed(2).replace(".", ",") + " €";
}

function calc() {
  const matData = materialEl.value.split("|");
  const matKg = parseFloat(matData[0]);
  const matFactor = parseFloat(matData[1]);

  const L = parseFloat(lenEl.value) || 0;
  const W = parseFloat(widEl.value) || 0;
  const H = parseFloat(heiEl.value) || 0;

  const volume = (L * W * H) / 1000;

  const infill = parseFloat(infillEl.value) || 0.15;

  const weight = volume * infill;
  const materialCost = weight * (matKg / 1000);
  const printHours = volume * 0.005;
  const machineCost = printHours * 1;
  const workCost = 0.50;

  const subtotal = materialCost + machineCost + workCost;
  const basePrice = subtotal * matFactor * 1.20;

  const qtyVal = parseInt(qtyEl.value) || 1;

  let discount = 1 - (1 / (1 + 0.8 * Math.log(qtyVal)));
  discount = Math.min(discount, 0.80);

  let pricePerPiece = basePrice * (1 - discount);

  let firstPiecePrice = Math.max(pricePerPiece, 4.50);
  let otherPiecesPrice = pricePerPiece;

  let totalPrice = qtyVal === 1
    ? firstPiecePrice
    : firstPiecePrice + (otherPiecesPrice * (qtyVal - 1));

  price.textContent = euro(totalPrice);

  priceDetails.innerHTML = `
    Füllung: ${(infill * 100).toFixed(0)} %<br>
    Einzelpreis: ${euro(otherPiecesPrice)}<br>
    Rabatt: ${(discount * 100).toFixed(1)} %<br>
    Gesamtpreis: ${euro(totalPrice)}
  `;
}

/* STL VORSCHAU */
let scene, camera, renderer, controls, mesh;

function initPreview() {
  const container = document.getElementById("previewContainer");

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdddddd);

  camera = new THREE.PerspectiveCamera(
    45,
    container.offsetWidth / container.offsetHeight,
    0.1,
    10000
  );
  camera.position.set(150, 150, 150);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.offsetWidth, container.offsetHeight);
  container.innerHTML = "";
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);

  const light1 = new THREE.DirectionalLight(0xffffff, 1);
  light1.position.set(1, 1, 1);
  scene.add(light1);

  const light2 = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(light2);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  if (renderer && camera && scene) {
    renderer.render(scene, camera);
  }
}

const loader = new THREE.STLLoader();

stlFileEl.addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function (event) {
    try {
      const geometry = loader.parse(event.target.result);
      geometry.computeBoundingBox();
      const box = geometry.boundingBox;

      lenEl.value = (box.max.x - box.min.x).toFixed(2);
      widEl.value = (box.max.y - box.min.y).toFixed(2);
      heiEl.value = (box.max.z - box.min.z).toFixed(2);

      stlInfo.classList.remove("hidden");
      resetStl.classList.remove("hidden");

      initPreview();

      if (mesh) scene.remove(mesh);

      const material = new THREE.MeshStandardMaterial({ color: 0x999999 });
      mesh = new THREE.Mesh(geometry, material);

      const center = new THREE.Vector3();
      geometry.boundingBox.getCenter(center);
      mesh.position.sub(center);

      scene.add(mesh);

      const size = new THREE.Vector3(
        box.max.x - box.min.x,
        box.max.y - box.min.y,
        box.max.z - box.min.z
      ).length();

      camera.position.set(size, size, size);
      camera.lookAt(0, 0, 0);
      controls.update();

      calc();
    } catch {
      alert("STL konnte nicht gelesen werden.");
    }
  };
  reader.readAsArrayBuffer(file);
});

resetStl.addEventListener("click", () => {
  lenEl.value = "";
  widEl.value = "";
  heiEl.value = "";
  stlFileEl.value = "";
  stlInfo.classList.add("hidden");
  resetStl.classList.add("hidden");
  calc();
});

window.addEventListener("resize", () => {
  const container = document.getElementById("previewContainer");
  if (!renderer || !camera || !container) return;
  camera.aspect = container.offsetWidth / container.offsetHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.offsetWidth, container.offsetHeight);
});

document.querySelectorAll("input, select").forEach(el =>
  el.addEventListener("input", calc)
);

calc();
</script>

</body>
</html>
